name: Android release build (paused)

# Paused until this independent app has its own package ID, Render URL,
# signing configuration, release tag, and versioning. Do not publish an APK
# that points to the original Omegaplus Pro AI production site.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain paused status
        run: echo "Android release is paused until the independent app identity and deployment URL are configured."
