name: Production smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "prediction-calibration.js"
      - "public/index.html"
      - "public/intelligence.js"
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production health endpoint
        run: |
          for attempt in $(seq 1 18); do
            if curl --silent --show-error --fail --max-time 10 "https://omegaplus-auto-prediction-ai.onrender.com/health" -o /tmp/health.json; then
              node -e 'const d=require("/tmp/health.json"); if(d.status!=="healthy"||d.service!=="omegaplus-auto-prediction-ai") process.exit(1); console.log("Production health endpoint is healthy:", d.version)'
              exit $?
            fi
            echo "Production is still deploying (attempt $attempt/18)"
            sleep 10
          done
          echo "Production health endpoint did not become healthy in time."
          exit 1
      - name: Verify diagnostics API responds
        run: |
          curl --silent --show-error --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "https://omegaplus-auto-prediction-ai.onrender.com/api/health" -o /tmp/api-health.json
          node -e 'const d=require("/tmp/api-health.json"); if(!d.ok||!d.service) process.exit(1); console.log("Diagnostics API:", d.status, "database:", d.dbReady?"ready":d.dbConfigured?"unavailable":"not configured"); if(d.status!=="healthy") console.warn("Production is degraded; inspect the diagnostics payload.")'
      - name: Verify calibration endpoint responds
        run: |
          TODAY=$(date -u +%F)
          curl --silent --show-error --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "https://omegaplus-auto-prediction-ai.onrender.com/api/prediction-calibration?from=$TODAY&to=$TODAY" -o /tmp/calibration.json
          node -e 'const d=require("/tmp/calibration.json"); if(!d.ok||!Array.isArray(d.reliabilityBins)||typeof d.sampleSize!=="number") process.exit(1); console.log("Calibration endpoint OK; evaluated sample:", d.sampleSize)'
