name: Production smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "prediction-calibration.js"
      - "public/index.html"
      - "public/intelligence.js"
      - "public/voice-assistant.js"
      - "public/ai-chat.js"
      - "android/**"
      - "test/**"
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the new calibration API to reach production
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 10 "https://omegaplus-auto-prediction-ai.onrender.com/api/prediction-calibration?from=$(date -u +%F)&to=$(date -u +%F)" -o /tmp/calibration.json; then
              if node -e 'const fs=require("fs"); let d; try { d=JSON.parse(fs.readFileSync("/tmp/calibration.json","utf8")); } catch { process.exit(1); } if(!d.ok||!Array.isArray(d.reliabilityBins)||typeof d.sampleSize!=="number") process.exit(1); console.log("Calibration API is live; evaluated sample:",d.sampleSize)'; then
                exit 0
              fi
            fi
            echo "Waiting for new production version (attempt $attempt/30)"
            sleep 10
          done
          echo "The calibration API did not become available in production."
          exit 1
      - name: Verify production health endpoint
        run: |
          curl --silent --show-error --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "https://omegaplus-auto-prediction-ai.onrender.com/health" -o /tmp/health.json
          node -e 'const fs=require("fs"),d=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(d.status!=="healthy"||d.service!=="omegaplus-auto-prediction-ai") process.exit(1); console.log("Production health endpoint is healthy:",d.version)'
      - name: Verify diagnostics and database status
        run: |
          curl --silent --show-error --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "https://omegaplus-auto-prediction-ai.onrender.com/api/health" -o /tmp/api-health.json
          node -e 'const fs=require("fs"),d=JSON.parse(fs.readFileSync("/tmp/api-health.json","utf8")); if(!d.ok||!d.service||!["healthy","degraded"].includes(d.status)||!d.database) process.exit(1); console.log("Diagnostics API:",d.status,"database:",d.dbReady?"ready":d.dbConfigured?"unavailable":"not configured"); if(d.status!=="healthy") console.warn("Production is degraded; inspect the diagnostics payload.")'

      - name: Verify updated frontend assets and cache versions
        run: |
          curl --silent --show-error --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "https://omegaplus-auto-prediction-ai.onrender.com/" -o /tmp/index.html
          grep -q 'voice-assistant.js?v=1.0.7' /tmp/index.html
          grep -q 'ai-chat.js?v=1.1.3' /tmp/index.html
          curl --silent --show-error --fail --max-time 20 "https://omegaplus-auto-prediction-ai.onrender.com/voice-assistant.js?v=1.0.7" -o /tmp/voice-assistant.js
          curl --silent --show-error --fail --max-time 20 "https://omegaplus-auto-prediction-ai.onrender.com/ai-chat.js?v=1.1.3" -o /tmp/ai-chat.js
          grep -q 'omega-native-speech-fallback' /tmp/voice-assistant.js
          grep -q 'omega-native-speech-fallback' /tmp/ai-chat.js
          echo "Updated voice and AI chat assets are served."
      - name: Verify private assistant API requires login
        run: |
          CODE=$(curl --silent --show-error --max-time 20 -o /tmp/auth-check.json -w '%{http_code}' -X POST "https://omegaplus-auto-prediction-ai.onrender.com/api/assistant/chat" -H 'content-type: application/json' --data '{"message":"production smoke check"}')
          STATUS="$CODE" node -e 'const fs=require("fs"),d=JSON.parse(fs.readFileSync("/tmp/auth-check.json","utf8")); if(process.env.STATUS!=="401"||d.ok!==false||d.code!=="AUTH_REQUIRED") process.exit(1); console.log("Private assistant API correctly requires authentication.")'
      - name: Verify calibration validation rejects invalid inputs
        run: |
          CODE=$(curl --silent --show-error --max-time 20 -o /tmp/invalid-date.json -w '%{http_code}' "https://omegaplus-auto-prediction-ai.onrender.com/api/prediction-calibration?from=2026-02-30&to=2026-02-30")
          STATUS="$CODE" node -e 'const fs=require("fs"),d=JSON.parse(fs.readFileSync("/tmp/invalid-date.json","utf8")); if(process.env.STATUS!=="400"||d.ok!==false) process.exit(1); console.log("Invalid calendar dates are rejected.")'
