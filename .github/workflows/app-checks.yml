name: Auto Prediction AI checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/offline-first-database]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check auth.js
      - run: node --check support.js
      - run: node --check offline-sync.js
      - run: node --check public/offline-first.js
      - run: node --check social-publishing.js
      - run: node --check public/voice-assistant.js
      - run: node --check public/sw.js
      - run: npm test
